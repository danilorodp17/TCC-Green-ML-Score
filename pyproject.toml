[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-ml-score"
version = "0.1.0"
description = "Métrica ambiental para modelos de Machine Learning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Octávio de Sousa Bordotti" },
  { name = "Danilo Rodrigues Parolin" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mlflow>=2.0.0",
    "codecarbon>=2.3.1",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=26,<27",
    "ruff>=0.15,<0.16"
]
experiments = [
    "xgboost>=1.7.0",
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "matplotlib>=3.6.0",
    "tabulate>=0.9.0",
    "threadpoolctl>=3.1.0"
]
# Painel interativo (app/), que exige Python 3.11 ou superior. Versões mínimas iguais
# às testadas: o painel usa recursos recentes do Streamlit (st.navigation,
# segmented_control, badge, width="stretch").
app = [
    "streamlit>=1.66",
    "plotly>=7.1",
    "matplotlib>=3.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["green_ml_score", "green_ml_score.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
# Mesmo alvo do ruff; sem isso o Black infere até 3.14 a partir de requires-python.
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
